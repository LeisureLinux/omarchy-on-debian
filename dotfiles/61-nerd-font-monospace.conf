<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Force the generic monospace alias to a proper Nerd Font.
     Fixes: fc-match monospace resolving to Sun-ExtA (font claims 200+ langs,
     wins under zh locale), which broke nerd-font glyph fallback
     (weather icons etc). Strong prepend beats Sun-ExtA's lang bonus. -->
<fontconfig>
  <match target="pattern">
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>FiraCode Nerd Font</string>
    </edit>
  </match>
</fontconfig>
